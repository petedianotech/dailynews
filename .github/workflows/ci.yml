name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
        env:
          NEWS_RSS_SOURCES: https://techcrunch.com/feed/
          NEXT_PUBLIC_SITE_URL: https://example.com
